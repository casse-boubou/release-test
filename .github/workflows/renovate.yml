---
name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: ⬆️ Self-hosted Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_DOCKER_GHCR_IO_USERNAME: casse-boubou
          RENOVATE_DOCKER_GHCR_IO_PASSWORD: ${{ secrets.RENOVATE_TOKEN }}
        #   LOG_LEVEL: 'debug'

---
name: Release Drafter

on:
  # push:
  #   branches:
  #     - main
  # schedule:
  #   - cron: "5 4 * * 5"
  workflow_dispatch:


jobs:
  draft_release:
    name: Draft
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag_name: ${{ steps.draft.outputs.tag_name }}
      body: ${{ steps.draft.outputs.body }}
      id: ${{ steps.draft.outputs.id }}
    steps:
      # Draft the release
      - name: ✏️ Draf release
        id: draft
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter-config.yml
          # config-name: .github:release-drafter-config.yml

  publish_release:
    needs: draft_release
    name: Publish
    runs-on: ubuntu-slim
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.publish.outputs.is_need }}
    steps:
      # Decide if release need Publish
      - name: 📦 Publish release if needed
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          BODY: ${{ needs.draft_release.outputs.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.draft_release.outputs.id }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [[ "$BODY" != *"No changes"* ]]; then
            echo "Release will be publish and deploy"
            gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false
            echo "is_need=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release do not need publish"
            echo "is_need=false" >> "$GITHUB_OUTPUT"
          fi

  deploy_release:
    needs:
      - draft_release
      - publish_release
    if: needs.publish_release.outputs.deploy == 'true'
    name: Deploy packages
    permissions:
      contents: read # needed for job 'lint_zizmor' and 'build'
      actions: read # needed for job 'lint_zizmor'
      packages: write # needed for job 'build'
      id-token: write # needed for job 'build'
    uses: $/.github/workflows/deploy.yml
    with:
      tag: ${{ needs.draft_release.outputs.tag_name }}


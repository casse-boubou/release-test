---
name: changelog

on:
  # push:
  #   branches:
  #     - main
  # schedule:
  #   - cron: "5 4 * * 5"
  workflow_dispatch:


permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(jq -r --arg v "$VERSION" '
            .[] | select(.version == $v) |
            "## What'\''s new in v\(.version)\n\n" +
            ([.changes[] |
              if .type == "feature" then "- ✨ \(.text)"
              elif .type == "fix" then "- 🐛 \(.text)"
              elif .type == "improvement" then "- ⚡ \(.text)"
              else "- \(.text)"
              end
            ] | join("\n")) +
            "\n"
          ' src/lib/data/changelog.json)

          if [ -z "$BODY" ]; then
            BODY="Release ${GITHUB_REF_NAME}"
          fi

          cat <<EOF > /tmp/release-body.md
          ${BODY}

          EOF

          sed -i 's/^          //' /tmp/release-body.md

      - name: Create release
        env:
          BODY_PATH: /tmp/release-body.md
        run: |
          echo ${BODY_PATH}
name: Create Release

on:
  # schedule:
  #   - cron: "5 4 * * 5"
  # push:
  #   tags:
  #     - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true  # Enable GitHub's built-in note generator
          # body_path: ${{ github.workspace }}-CHANGELOG.txt
          # Optional: Mark as draft (review before publishing)
          # draft: true
          # Optional: Mark as prerelease
          # prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
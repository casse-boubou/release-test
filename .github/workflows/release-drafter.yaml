---
name: Release Drafter

on:
  # push:
  #   branches:
  #     - main
  # schedule:
  #   - cron: "5 4 * * 5"
  workflow_dispatch:


jobs:
  draft_release:
    name: ✏️ Draft release
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Draft the release
      - name: ✏️ Draf Release
        id: draft
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter-config.yml
          # config-name: .github:release-drafter-config.yml

      # # Publish the release
      - name: 📦 Publish Release
        id: publish
        if: github.event_name == 'workflow_dispatch' && !contains(steps.draft.outputs.body, 'No changes')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${RELEASE_ID}" -F draft=false


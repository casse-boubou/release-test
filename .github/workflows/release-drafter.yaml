  workflow_dispatch:


jobs:
  draft_release:
    name: ✏️ Draft release
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Draft the release
      - name: 🚀 Draf Release
        id: draft
        # if: ${{ github.event_name == 'push' }}
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter-config.yml
          # config-name: .github:release-drafter-config.yml
      - name: Deploy user service
        if: ! contains(steps.draft.outputs.body, 'No changes')
        run: echo "ne contient pas" && echo "${{ steps.draft.outputs.body }}"

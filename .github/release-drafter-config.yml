---
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) by $AUTHORS"
sort-direction: ascending


sync-labels: true
autolabeler:
  - labels: ['chore', 'documentation']
    files:
      - '*.md'
    branch:
      - '/docs{0,1}\/.+/'
  - labels: ['bug']
    stop-on-match: true
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - labels: ['enhancement']
    branch:
      - '/feature\/.+/'
    body:
      - '/JIRA-[0-9]{1,4}/'
  - labels: ['needs-triage', 'uncategorized']
    fallback: true


categories:
  - title: "🚨 Breaking changes"
    semver-increment: "major"
    collapse-after: 6
    when:
      labels:
        - "breaking-change"
  - title: "✨ New features"
    semver-increment: "minor"
    collapse-after: 6
    when:
      labels:
        - "new-feature"
  - title: "🐛 Bug fixes"
    semver-increment: "patch"
    collapse-after: 6
    when:
      labels:
        - "bugfix"
        - 'bug'
        - 'fix'
  - title: "🚀 Enhancements"
    semver-increment: "patch"
    collapse-after: 6
    when:
      labels:
        - "enhancement"
        - "refactor"
        - "performance"
        - "chore"
  - title: "🧰 Maintenance"
    semver-increment: "patch"
    collapse-after: 6
    when:
      labels:
        - "maintenance"
        - "ci"
  - title: "📚 Documentation"
    semver-increment: "patch"
    collapse-after: 6
    when:
      labels:
        - "documentation"
  # - title: "⬆️ Dependency updates"
  #   semver-increment: "minor"
    # collapse-after: 6
  #   when:
  #     labels:
  #       - "dependencies"
  - title: "⬆️ Dependency updates"
    semver-increment: "patch"
    collapse-after: 6
    when:
      labels:
        - "dependencies"
  - type: 'version-resolver'
    semver-increment: 'patch'
    collapse-after: 6


template: |
  ## What’s changed
  [Full Changelog](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG)

  $CHANGES


---
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) by $AUTHORS"
sort-direction: ascending

categories:
  - title: "🚨 Breaking changes"
    semver-increment: "major"
    when:
      labels:
        - "breaking-change"
  - title: "✨ New features"
    semver-increment: "minor"
    when:
      labels:
        - "new-feature"
  - title: "🐛 Bug fixes"
    semver-increment: "patch"
    when:
      labels:
        - "bugfix"
  - title: "🚀 Enhancements"
    semver-increment: "patch"
    when:
      labels:
        - "enhancement"
        - "refactor"
        - "performance"
        - "chore"
  - title: "🧰 Maintenance"
    semver-increment: "patch"
    when:
      labels:
        - "maintenance"
        - "ci"
  - title: "📚 Documentation"
    semver-increment: "patch"
    when:
      labels:
        - "documentation"
  - title: "⬆️ Dependency updates"
    semver-increment: "patch"
    when:
      labels:
        - "dependencies"
  - type: 'version-resolver'
    semver-increment: 'patch'


template: |
  ## What’s changed
  [Full Changelog](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG)

  $CHANGES


---
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE (#$NUMBER) by $AUTHORS"
sort-direction: ascending

categories:
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - "major"
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - "minor"
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - "patch"
  - type: 'version-resolver'
    semver-increment: 'patch'
  - title: "🚨 Breaking changes"
    exclusive: true
    collapse-after: 6
    when:
      labels:
        - "breaking-change"
    semver-increment: "major"
  - title: "✨ New features"
    exclusive: true
    collapse-after: 6
    when:
      labels:
        - "new-feature"
    semver-increment: "minor"
  - title: "🐛 Bug fixes"
    exclusive: true
    collapse-after: 6
    when:
      labels:
        - "bugfix"
        - 'bug'
        - 'fix'
  - title: "🚀 Enhancements"
    exclusive: true
    collapse-after: 6
    when:
      labels:
        - "enhancement"
        - "refactor"
        - "performance"
        - "chore"
  - title: "🧰 Maintenance"
    exclusive: true
    collapse-after: 6
    when:
      labels:
        - "maintenance"
        - "ci"
        - "pin"
  - title: "📚 Documentation"
    exclusive: true
    collapse-after: 6
    when:
      labels:
        - "documentation"
  - title: "⬆️ Dependency updates"
    exclusive: true
    when:
      labels:
        - "dependencies"
    collapse-after: 6


template: |
  ## What’s changed
  [Full Changelog](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG)

  $CHANGES

